# =============================
# ESPHOME namings
# =============================
substitutions:
  name: waveshare-bathroom
  friendly_name: Waveshare - BathRoom

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

# =============================
# HARDWARE
# =============================
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz
i2c:
  sda: GPIO8
  scl: GPIO9

ch422g:
  - id: ch422g_hub

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: main_display
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

# =============================
# LOGS 
# =============================
logger:
  hardware_uart: UART0
  level: DEBUG

  
# =============================
# CONNEXION  
# =============================
api:
  encryption:
    key: "P746hgv+Q7QtReW8T5Xs5r39IpXMIQURSjoBSYf+hbs="

ota:
  - platform: esphome
    password: !secret waveshare_bathroom__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waveshare-Bathroom-Fallback"
captive_portal:

# =============================
# HOME ASSISTANT DATA
# =============================

sensor:
  # températures
  - platform: homeassistant
    id: indoor_temperature
    entity_id: sensor.thermo_int_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: indoor_temperature_value
            text:
              format: "%.1f °C"
              args: [x]

  - platform: homeassistant
    id: outdoor_temperature
    entity_id: sensor.thermo_ext_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: outdoor_temperature_value
            text:
              format: "%.1f °C"
              args: [x]

  # humidités
  - platform: homeassistant
    id: indoor_humidity
    entity_id: sensor.thermo_int_humidite
    on_value:
      then:
        - lvgl.arc.update:
            id: indoor_humidity_arc
            value: !lambda return static_cast<int>(x);

        - lvgl.label.update:
            id: indoor_humidity_value
            text:
              format: "%.0f%%"
              args: [x]

  - platform: homeassistant
    id: outdoor_humidity
    entity_id: sensor.thermo_ext_humidite
    on_value:
      then:
        - lvgl.arc.update:
            id: outdoor_humidity_arc
            value: !lambda return static_cast<int>(x);

        - lvgl.label.update:
            id: outdoor_humidity_value
            text:
              format: "%.0f%%"
              args: [x]

  # Humidex
  - platform: homeassistant
    id: humidex_out
    entity_id: sensor.thermo_ext_humidex
    
json: 
text_sensor:
  # Météo - condition actuelle
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.saint_georges
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_condition
            text: !lambda return x;

  - platform: homeassistant
    id: sunset_sunrise
    entity_id: sensor.soleil_coucher_lever
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_sunset_sunrise
            text: !lambda return x;

  # Météo - dataset complet
  - platform: homeassistant
    id: weather_data
    entity_id: sensor.saint_georges_esphome_weather
    attribute: data

    on_value:
      then:
        - logger.log:
            format: "Weather payload reçu : %u bytes"
            args: [ 'x.size()' ]

        - lvgl.label.update:
            id: lbl_weather_current
            text: !lambda |-
              std::string output;

              bool parsed = json::parse_json(
                x,
                [&output](JsonObject root) -> bool {
                  if (!root["current"]) {
                    output = "JSON OK\nMais current absent";
                    return true;
                  }

                  JsonObject current = root["current"];

                  const char *condition =
                    current["condition"] | "unknown";

                  char buffer[512];

                  snprintf(
                    buffer,
                    sizeof(buffer),
                    "%s\n\n"
                    "Température : %.1f °C\n"
                    "Ressenti : %.1f °C\n"
                    "Humidite : %.0f %%\n"
                    "Précipitations : %.1f mm\n"
                    "Vent : %.1f km/h\n"
                    "Rafales : %.1f km/h\n"
                    "Pression : %.1f hPa\n"
                    "Visibilité : %.1f km\n"
                    "UV : %.2f\n"
                    "Nuages : %.0f %%",
                    condition,
                    current["native_temperature"].as<float>(),
                    current["native_apparent_temperature"].as<float>(),
                    current["humidity"].as<float>(),
                    current["native_precipitation"].as<float>(),
                    current["native_wind_speed"].as<float>(),
                    current["native_wind_gust_speed"].as<float>(),
                    current["native_pressure"].as<float>(),
                    current["native_visibility"].as<float>(),
                    current["uv_index"].as<float>(),
                    current["cloud_coverage"].as<float>()
                  );

                  output = buffer;
                  return true;
                }
              );

              if (!parsed) {
                return std::string("JSON réellement invalide");
              }

              return output;
# =============================
# INTERFACE
# =============================
lvgl:
  displays:
    - main_display

  touchscreens:
    - touchscreen_id: main_touch

  widgets:
      # Météo - condition actuelle
  - label:
      id: lbl_weather_condition
      align: TOP_MID
      y: 30
      text: "--"
  
  # températures
  - label:
      id: lbl_indoor_temperature
      align: TOP_LEFT
      x: 60
      y: 100
      text: "--.- °C"

  - label:
      id: lbl_outdoor_temperature
      align: TOP_RIGHT
      x: -60
      y: 100
      text: "--.- °C"
  
  # humidités
  - label:
      id: lbl_indoor_humidity
      align: TOP_LEFT
      x: 60
      y: 140
      text: "-- %"

  - label:
      id: lbl_outdoor_humidity
      align: TOP_RIGHT
      x: -60
      y: 140
      text: "-- %"
  
  # Humidex
  - label:
      id: lbl_humidex_out
      align: TOP_MID
      y: 200
      text: "--"
  
  # Lever / coucher du soleil
  - label:
      id: lbl_sunset_sunrise
      align: TOP_MID
      y: 250
      text: "--"
  - label:
      id: lbl_weather_current
      align: CENTER
      width: 0%
      text_align: LEFT
      text: "Attente météo..."
