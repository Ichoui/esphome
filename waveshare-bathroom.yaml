# =============================
# ESPHOME namings
# =============================
substitutions:
  name: waveshare-bathroom
  friendly_name: Waveshare - BathRoom

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

# =============================
# HARDWARE
# =============================
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz
i2c:
  sda: GPIO8
  scl: GPIO9

ch422g:
  - id: ch422g_hub

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: main_display
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

# =============================
# LOGS 
# =============================

logger:
  hardware_uart: UART0
  level: DEBUG
# =============================
# CONNEXION  
# =============================
api:
  encryption:
    key: "P746hgv+Q7QtReW8T5Xs5r39IpXMIQURSjoBSYf+hbs="

ota:
  - platform: esphome
    password: !secret waveshare_bathroom__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waveshare-Bathroom-Fallback"


# =============================
# HOME ASSISTANT DATA
# =============================

sensor:
  # températures
  - platform: homeassistant
    id: indoor_temperature
    entity_id: sensor.thermo_int_temperature
    
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: sensor.thermo_out_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_outdoor_temperature
            text:
              format: "%.1f °C"
              args: [x]
    
  # humidités
  - platform: homeassistant
    id: indoor_humidity
    entity_id: sensor.thermo_int_humidity
  - platform: homeassistant
    id: outdoor_humidity
    entity_id: sensor.thermo_out_humidity

  # Humidex
  - platform: homeassistant
    id: humidex_out
    entity_id: sensor.thermo_out_humidex    
    
  
text_sensor:
  # Météo - condition actuelle
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.saint_georges
  - platform: homeassistant
    id: sunset_sunrise
    entity_id: sensor.soleil_coucher_lever


# =============================
# INTERFACE
# =============================
lvgl:
  displays:
    - main_display

  touchscreens:
    - touchscreen_id: main_touch

  widgets:
    - label:
        id: lbl_outdoor_temperature
        align: CENTER
        text: "--.- °C"