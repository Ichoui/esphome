# =============================
# ESPHOME namings
# =============================
substitutions:
  name: waveshare-bathroom
  friendly_name: Waveshare - BathRoom

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - switch.template.publish:
          id: display_backlight
          state: ON

# =============================
# HARDWARE
# =============================
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz
i2c:
  sda: GPIO8
  scl: GPIO9

ch422g:
  - id: ch422g_hub

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: main_display
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    on_touch:
      then:
        - lambda: |-
            auto now = id(homeassistant_time).now();
            if (now.is_valid()) {
              char buffer[24];
              now.strftime(buffer, sizeof(buffer), "%Y-%m-%d %H:%M:%S");
              id(last_touch_at).publish_state(buffer);
            } else {
              id(last_touch_at).publish_state("heure indisponible");
            }
        - if:
            condition:
              switch.is_off: display_backlight
            then:
              - globals.set:
                  id: backlight_wake_guard
                  value: 'true'
              - switch.turn_on: display_backlight
              - delay: 700ms
              - globals.set:
                  id: backlight_wake_guard
                  value: 'false'

# =============================
# LOGS 
# =============================
logger:
  hardware_uart: UART0
  level: DEBUG

  
# =============================
# CONNEXION  
# =============================
api:
  encryption:
    key: "P746hgv+Q7QtReW8T5Xs5r39IpXMIQURSjoBSYf+hbs="

ota:
  - platform: esphome
    password: !secret waveshare_bathroom__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waveshare-Bathroom-Fallback"
captive_portal:

# Heure locale synchronisée par Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

globals:
  - id: backlight_enabled
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: backlight_wake_guard
    type: bool
    restore_value: no
    initial_value: 'false'

# =============================
# HOME ASSISTANT CONTROLS
# =============================

switch:
  - platform: template
    id: display_backlight
    name: "Waveshare Bathroom Backlight"
    icon: mdi:monitor-shimmer
    internal: false
    lambda: |-
      return id(backlight_enabled);
    turn_on_action:
      - lambda: |-
          id(backlight_enabled) = true;
          id(ch422g_hub).digital_write(2, true);
          if (id(backlight_state_label) != nullptr) {
            lv_label_set_text(id(backlight_state_label), "ON");
          }
          ESP_LOGI("backlight", "Retroeclairage allume");
      - switch.template.publish:
          id: display_backlight
          state: ON
    turn_off_action:
      - lambda: |-
          id(backlight_enabled) = false;
          id(ch422g_hub).digital_write(2, false);
          if (id(backlight_state_label) != nullptr) {
            lv_label_set_text(id(backlight_state_label), "OFF");
          }
          ESP_LOGI("backlight", "Retroeclairage eteint");
      - switch.template.publish:
          id: display_backlight
          state: OFF

button:
  - platform: restart
    id: restart_device
    name: "Waveshare Bathroom Restart"
    entity_category: diagnostic

# =============================
# HOME ASSISTANT DATA
# =============================

sensor:
  # Températures locales réelles exposées par Home Assistant.
  - platform: homeassistant
    id: indoor_temperature
    entity_id: sensor.thermo_int_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: indoor_temperature_value
            text:
              format: "%.1f °C"
              args: [x]

  - platform: homeassistant
    id: outdoor_temperature
    entity_id: sensor.thermo_ext_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: outdoor_temperature_value
            text:
              format: "%.1f °C"
              args: [x]

  # Humidités locales réelles exposées par Home Assistant.
  - platform: homeassistant
    id: indoor_humidity
    entity_id: sensor.thermo_int_humidite
    on_value:
      then:
        - lvgl.arc.update:
            id: indoor_humidity_arc
            value: !lambda return static_cast<int>(x);

        - lvgl.label.update:
            id: indoor_humidity_value
            text:
              format: "%.0f%%"
              args: [x]

  - platform: homeassistant
    id: outdoor_humidity
    entity_id: sensor.thermo_ext_humidite
    on_value:
      then:
        - lvgl.arc.update:
            id: outdoor_humidity_arc
            value: !lambda return static_cast<int>(x);

        - lvgl.label.update:
            id: outdoor_humidity_value
            text:
              format: "%.0f%%"
              args: [x]

  # Humidex extérieur réel exposé par Home Assistant.
  - platform: homeassistant
    id: humidex_out
    entity_id: sensor.thermo_ext_humidex
    on_value:
      then:
        - lvgl.label.update:
            id: humidex_out_value
            text:
              format: "%.0f"
              args: [x]

  # Diagnostics exposes vers Home Assistant.
  - platform: uptime
    id: device_uptime
    name: "Waveshare Bathroom Uptime"
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    id: wifi_rssi
    name: "Waveshare Bathroom WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic

json:

text_sensor:
  # Diagnostics exposes vers Home Assistant.
  - platform: wifi_info
    ip_address:
      id: wifi_ip_address
      name: "Waveshare Bathroom IP Address"
      entity_category: diagnostic

  - platform: version
    id: esphome_version
    name: "Waveshare Bathroom ESPHome Version"
    entity_category: diagnostic

  - platform: template
    id: last_touch_at
    name: "Waveshare Bathroom Last Touch"
    icon: mdi:gesture-tap
    entity_category: diagnostic
    update_interval: never

  # Fallback simple si le gros JSON météo n'est pas encore arrivé.
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.saint_georges
    on_value:
      then:
        - lvgl.label.update:
            id: weather_condition_label
            text: !lambda |-
              // Montserrat embarqué ne rend pas toujours les glyphes accentués sur l'écran.
              auto strip_accents = [](std::string value) -> std::string {
                auto replace_all = [](std::string &target, const char *from, const char *to) {
                  size_t pos = 0;
                  while ((pos = target.find(from, pos)) != std::string::npos) {
                    target.replace(pos, strlen(from), to);
                    pos += strlen(to);
                  }
                };

                replace_all(value, "à", "a"); replace_all(value, "á", "a"); replace_all(value, "â", "a"); replace_all(value, "ä", "a");
                replace_all(value, "À", "A"); replace_all(value, "Á", "A"); replace_all(value, "Â", "A"); replace_all(value, "Ä", "A");
                replace_all(value, "ç", "c"); replace_all(value, "Ç", "C");
                replace_all(value, "é", "e"); replace_all(value, "è", "e"); replace_all(value, "ê", "e"); replace_all(value, "ë", "e");
                replace_all(value, "É", "E"); replace_all(value, "È", "E"); replace_all(value, "Ê", "E"); replace_all(value, "Ë", "E");
                replace_all(value, "î", "i"); replace_all(value, "ï", "i"); replace_all(value, "Î", "I"); replace_all(value, "Ï", "I");
                replace_all(value, "ô", "o"); replace_all(value, "ö", "o"); replace_all(value, "Ô", "O"); replace_all(value, "Ö", "O");
                replace_all(value, "ù", "u"); replace_all(value, "û", "u"); replace_all(value, "ü", "u");
                replace_all(value, "Ù", "U"); replace_all(value, "Û", "U"); replace_all(value, "Ü", "U");
                return value;
              };

              return strip_accents(x);

  # Conservé pour tests HA; les cartes lever/coucher utilisent weather_data.
  - platform: homeassistant
    id: sunset_sunrise
    entity_id: sensor.soleil_coucher_lever

  # Dataset météo complet relayé par Home Assistant.
  - platform: homeassistant
    id: weather_data
    entity_id: sensor.saint_georges_esphome_weather
    attribute: data
    on_value:
      then:
        - logger.log:
            format: "Weather payload recu : %u bytes"
            args: [ 'x.size()' ]
        - lambda: |-
            auto set_text = [](auto label, const char *value) {
              lv_label_set_text(label, value == nullptr || value[0] == '\0' ? "--" : value);
            };

            auto set_float = [](auto label, JsonVariant value, const char *format, const char *fallback) {
              if (value.isNull()) {
                lv_label_set_text(label, fallback);
                return;
              }
              char buffer[32];
              snprintf(buffer, sizeof(buffer), format, value.as<float>());
              lv_label_set_text(label, buffer);
            };

            auto strip_accents = [](std::string value) -> std::string {
              auto replace_all = [](std::string &target, const char *from, const char *to) {
                size_t pos = 0;
                while ((pos = target.find(from, pos)) != std::string::npos) {
                  target.replace(pos, strlen(from), to);
                  pos += strlen(to);
                }
              };

              replace_all(value, "à", "a"); replace_all(value, "á", "a"); replace_all(value, "â", "a"); replace_all(value, "ä", "a");
              replace_all(value, "À", "A"); replace_all(value, "Á", "A"); replace_all(value, "Â", "A"); replace_all(value, "Ä", "A");
              replace_all(value, "ç", "c"); replace_all(value, "Ç", "C");
              replace_all(value, "é", "e"); replace_all(value, "è", "e"); replace_all(value, "ê", "e"); replace_all(value, "ë", "e");
              replace_all(value, "É", "E"); replace_all(value, "È", "E"); replace_all(value, "Ê", "E"); replace_all(value, "Ë", "E");
              replace_all(value, "î", "i"); replace_all(value, "ï", "i"); replace_all(value, "Î", "I"); replace_all(value, "Ï", "I");
              replace_all(value, "ô", "o"); replace_all(value, "ö", "o"); replace_all(value, "Ô", "O"); replace_all(value, "Ö", "O");
              replace_all(value, "ù", "u"); replace_all(value, "û", "u"); replace_all(value, "ü", "u");
              replace_all(value, "Ù", "U"); replace_all(value, "Û", "U"); replace_all(value, "Ü", "U");
              return value;
            };

            auto set_text_ascii = [&](auto label, const char *value) {
              if (value == nullptr || value[0] == '\0') {
                lv_label_set_text(label, "--");
                return;
              }
              std::string clean = strip_accents(value);
              lv_label_set_text(label, clean.c_str());
            };

            auto compact_time = [](const char *raw) -> std::string {
              if (raw == nullptr || raw[0] == '\0') {
                return "--:--";
              }

              std::string value(raw);
              size_t separator = value.find('T');
              if (separator == std::string::npos) {
                separator = value.find(' ');
              }
              if (separator != std::string::npos && value.size() >= separator + 6) {
                return value.substr(separator + 1, 5);
              }
              if (value.size() >= 5 && value[2] == ':') {
                return value.substr(0, 5);
              }
              return value;
            };

            auto parse_utc_epoch = [](const char *raw, time_t &epoch) -> bool {
              if (raw == nullptr || raw[0] == '\0') {
                return false;
              }

              int year = 0;
              int month = 0;
              int day = 0;
              int hour = 0;
              int minute = 0;
              int second = 0;
              if (sscanf(raw, "%d-%d-%dT%d:%d:%d", &year, &month, &day, &hour, &minute, &second) < 5 &&
                  sscanf(raw, "%d-%d-%d %d:%d:%d", &year, &month, &day, &hour, &minute, &second) < 5) {
                return false;
              }

              ESPTime parsed{};
              parsed.year = year;
              parsed.month = month;
              parsed.day_of_month = day;
              parsed.hour = hour;
              parsed.minute = minute;
              parsed.second = second;
              parsed.recalc_timestamp_utc(false);
              if (parsed.timestamp < 0) {
                return false;
              }

              epoch = parsed.timestamp;
              return true;
            };

            auto local_hhmm = [&](const char *raw) -> std::string {
              time_t epoch = 0;
              if (!parse_utc_epoch(raw, epoch)) {
                return compact_time(raw);
              }

              ESPTime local_time = ESPTime::from_epoch_local(epoch);
              if (!local_time.is_valid(false, false)) {
                return compact_time(raw);
              }

              char buffer[8];
              local_time.strftime(buffer, sizeof(buffer), "%H:%M");
              return buffer;
            };

            auto last_sync_text = [&](const char *raw) -> std::string {
              return "MAJ " + local_hhmm(raw);
            };

            auto condition_icon_for = [](const char *condition_code) -> const char * {
              if (condition_code == nullptr) {
                return "\U000F0595";
              }

              std::string condition_probe(condition_code);
              if (condition_probe.find("thunder") != std::string::npos || condition_probe.find("lightning") != std::string::npos) {
                return "\U000F0593";
              }
              if (condition_probe.find("snow") != std::string::npos || condition_probe.find("sleet") != std::string::npos) {
                return "\U000F0598";
              }
              if (condition_probe.find("fog") != std::string::npos || condition_probe.find("mist") != std::string::npos) {
                return "\U000F0591";
              }
              if (condition_probe.find("rain") != std::string::npos || condition_probe.find("pouring") != std::string::npos) {
                return "\U000F0597";
              }
              if (condition_probe.find("sunny") != std::string::npos || condition_probe.find("clear") != std::string::npos) {
                return "\U000F0599";
              }
              if (condition_probe.find("cloud") != std::string::npos && condition_probe.find("partly") == std::string::npos) {
                return "\U000F0590";
              }
              return "\U000F0595";
            };

            auto condition_color_for = [](const char *condition_code) -> uint32_t {
              if (condition_code == nullptr) {
                return 0xCBD5E1;
              }

              std::string condition_probe(condition_code);
              if (condition_probe.find("thunder") != std::string::npos || condition_probe.find("lightning") != std::string::npos) {
                return 0xA78BFA;
              }
              if (condition_probe.find("snow") != std::string::npos || condition_probe.find("sleet") != std::string::npos) {
                return 0xBAE6FD;
              }
              if (condition_probe.find("fog") != std::string::npos || condition_probe.find("mist") != std::string::npos) {
                return 0x94A3B8;
              }
              if (condition_probe.find("rain") != std::string::npos || condition_probe.find("pouring") != std::string::npos) {
                return 0x60A5FA;
              }
              if (condition_probe.find("sunny") != std::string::npos || condition_probe.find("clear") != std::string::npos) {
                return 0xFACC15;
              }
              if (condition_probe.find("partly") != std::string::npos) {
                return 0xFDE68A;
              }
              if (condition_probe.find("cloud") != std::string::npos || condition_probe.find("overcast") != std::string::npos) {
                return 0xCBD5E1;
              }
              return 0xCBD5E1;
            };

            auto set_icon_color = [](lv_obj_t *label, uint32_t color) {
              lv_obj_set_style_text_color(
                label,
                lv_color_make((color >> 16) & 0xFF, (color >> 8) & 0xFF, color & 0xFF),
                LV_PART_MAIN
              );
            };

            bool parsed = json::parse_json(
              x,
              [&](JsonObject root) -> bool {
                JsonObject current = root["current"].as<JsonObject>();
                if (current.isNull()) {
                  set_text(id(weather_condition_label), "Meteo indisponible");
                  return true;
                }

                JsonObject supplemental_current = root["supplemental"]["current"].as<JsonObject>();
                JsonObject today = root["supplemental"]["daily"][0].as<JsonObject>();

                const char *city = "Saint-Georges";
                const char *city_candidate = root["location"]["name"] | "";
                if (city_candidate[0] == '\0') city_candidate = root["location"]["city"] | "";
                if (city_candidate[0] == '\0') city_candidate = root["city"] | "";
                if (city_candidate[0] == '\0') city_candidate = root["name"] | "";
                if (city_candidate[0] == '\0') city_candidate = root["metadata"]["city"] | "";
                if (city_candidate[0] != '\0') city = city_candidate;

                const char *condition_label = supplemental_current["condition_label_fr"] | "";
                if (condition_label[0] == '\0') condition_label = current["condition"] | "Meteo";

                const char *condition_code = current["condition"] | "";
                const char *condition_icon = condition_icon_for(condition_code);
                uint32_t condition_color = condition_color_for(condition_code);

                set_text_ascii(id(weather_city_label), city);
                set_text_ascii(id(weather_condition_label), condition_label);
                set_text(id(weather_condition_icon), condition_icon);
                set_icon_color(id(weather_condition_icon), condition_color);
                set_float(id(weather_current_temperature_value), current["native_temperature"], "%.1f °C", "--.- °C");

                std::string last_sync = last_sync_text(root["supplemental"]["source_updated_at"] | "");
                lv_label_set_text(id(weather_last_sync_label), last_sync.c_str());

                char apparent_buffer[40];
                if (current["native_apparent_temperature"].isNull()) {
                  snprintf(apparent_buffer, sizeof(apparent_buffer), "Ressenti --.- °C");
                } else {
                  snprintf(apparent_buffer, sizeof(apparent_buffer), "Ressenti %.1f °C", current["native_apparent_temperature"].as<float>());
                }
                lv_label_set_text(id(weather_apparent_temperature_value), apparent_buffer);

                char wind_buffer[40];
                if (current["native_wind_speed"].isNull() && current["native_wind_gust_speed"].isNull()) {
                  snprintf(wind_buffer, sizeof(wind_buffer), "-- / -- km/h");
                } else {
                  snprintf(
                    wind_buffer,
                    sizeof(wind_buffer),
                    "%.0f / %.0f km/h",
                    current["native_wind_speed"] | 0.0f,
                    current["native_wind_gust_speed"] | 0.0f
                  );
                }
                lv_label_set_text(id(weather_wind_value), wind_buffer);

                set_float(id(weather_uv_value), current["uv_index"], "%.1f", "--");

                char cloud_rain_buffer[40];
                if (current["cloud_coverage"].isNull() && current["native_precipitation"].isNull()) {
                  snprintf(cloud_rain_buffer, sizeof(cloud_rain_buffer), "--%% / -- mm");
                } else {
                  snprintf(
                    cloud_rain_buffer,
                    sizeof(cloud_rain_buffer),
                    "%.0f%% / %.1f mm",
                    current["cloud_coverage"] | 0.0f,
                    current["native_precipitation"] | 0.0f
                  );
                }
                lv_label_set_text(id(weather_cloud_rain_value), cloud_rain_buffer);

                std::string sunrise = compact_time(today["sunrise_at"] | "");
                std::string sunset = compact_time(today["sunset_at"] | "");
                lv_label_set_text(id(weather_sunrise_value), sunrise.c_str());
                lv_label_set_text(id(weather_sunset_value), sunset.c_str());

                auto set_hour = [&](JsonObject item, lv_obj_t *time_label, lv_obj_t *icon_label, lv_obj_t *temperature_label, lv_obj_t *wind_label, lv_obj_t *precipitation_label) {
                  if (item.isNull()) {
                    lv_label_set_text(time_label, "--:--");
                    lv_label_set_text(icon_label, "\U000F0595");
                    set_icon_color(icon_label, 0xCBD5E1);
                    lv_label_set_text(temperature_label, "--.-°");
                    lv_label_set_text(wind_label, "-- km/h");
                    lv_label_set_text(precipitation_label, "--mm - --%");
                    return;
                  }

                  const char *hour_condition = item["condition"] | "";
                  std::string hour = local_hhmm(item["datetime"] | "");
                  lv_label_set_text(time_label, hour.c_str());
                  lv_label_set_text(icon_label, condition_icon_for(hour_condition));
                  set_icon_color(icon_label, condition_color_for(hour_condition));
                  set_float(temperature_label, item["native_temperature"], "%.1f°", "--.-°");
                  set_float(wind_label, item["native_wind_speed"], "%.0f km/h", "-- km/h");

                  char precipitation_buffer[40];
                  if (item["native_precipitation"].isNull() && item["precipitation_probability"].isNull()) {
                    snprintf(precipitation_buffer, sizeof(precipitation_buffer), "--mm - --%%");
                  } else {
                    snprintf(
                      precipitation_buffer,
                      sizeof(precipitation_buffer),
                      "%.1fmm - %.0f%%",
                      item["native_precipitation"] | 0.0f,
                      item["precipitation_probability"] | 0.0f
                    );
                  }
                  lv_label_set_text(precipitation_label, precipitation_buffer);
                };

                JsonArray hourly = root["forecast"]["hourly"].as<JsonArray>();
                lv_obj_t *hourly_time_labels[] = {id(hourly_forecast_1_time), id(hourly_forecast_2_time), id(hourly_forecast_3_time), id(hourly_forecast_4_time), id(hourly_forecast_5_time), id(hourly_forecast_6_time), id(hourly_forecast_7_time), id(hourly_forecast_8_time), id(hourly_forecast_9_time), id(hourly_forecast_10_time), id(hourly_forecast_11_time), id(hourly_forecast_12_time)};
                lv_obj_t *hourly_icon_labels[] = {id(hourly_forecast_1_icon), id(hourly_forecast_2_icon), id(hourly_forecast_3_icon), id(hourly_forecast_4_icon), id(hourly_forecast_5_icon), id(hourly_forecast_6_icon), id(hourly_forecast_7_icon), id(hourly_forecast_8_icon), id(hourly_forecast_9_icon), id(hourly_forecast_10_icon), id(hourly_forecast_11_icon), id(hourly_forecast_12_icon)};
                lv_obj_t *hourly_temperature_labels[] = {id(hourly_forecast_1_temperature), id(hourly_forecast_2_temperature), id(hourly_forecast_3_temperature), id(hourly_forecast_4_temperature), id(hourly_forecast_5_temperature), id(hourly_forecast_6_temperature), id(hourly_forecast_7_temperature), id(hourly_forecast_8_temperature), id(hourly_forecast_9_temperature), id(hourly_forecast_10_temperature), id(hourly_forecast_11_temperature), id(hourly_forecast_12_temperature)};
                lv_obj_t *hourly_wind_labels[] = {id(hourly_forecast_1_wind), id(hourly_forecast_2_wind), id(hourly_forecast_3_wind), id(hourly_forecast_4_wind), id(hourly_forecast_5_wind), id(hourly_forecast_6_wind), id(hourly_forecast_7_wind), id(hourly_forecast_8_wind), id(hourly_forecast_9_wind), id(hourly_forecast_10_wind), id(hourly_forecast_11_wind), id(hourly_forecast_12_wind)};
